name: Build iOS (community)

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/build_ios.yml'
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'

jobs:
  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Flutter version from .tool-versions
        id: flutter-version
        run: |
          FLUTTER_VERSION=$(grep flutter .tool-versions | awk '{print $2}' | cut -d'-' -f1)
          echo "version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Generate community dart-defines fallback (same as bin/dev)
        run: |
          mkdir -p bin/.tmp/private_keys/dart_defines
          echo '{}' > bin/.tmp/private_keys/dart_defines/community.json

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # No Apple developer account / certificates available, so we build
      # without code signing. The .app bundle can be installed into an
      # iOS simulator, or re-signed later with your own certificate.
      - name: Build iOS (no codesign)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign \
            --flavor community \
            --target=lib/main_community.dart \
            --dart-define=CUPERTINO=yes \
            --dart-define-from-file=bin/.tmp/private_keys/dart_defines/community.json \
            2>&1 | tee build.log

      # Anonymous clients can't read Actions logs, so publish the tail of a
      # failed build to the ci-logs branch via the GitHub API (no git needed).
      - name: Push build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 400 build.log > ci-error.log || echo 'no log captured' > ci-error.log
          API=https://api.github.com
          AUTH="Authorization: Bearer $GH_TOKEN"
          REPO=${{ github.repository }}
          BASE_SHA=$(curl -sf -H "$AUTH" "$API/repos/$REPO/git/ref/heads/develop" | jq -r .object.sha)
          echo "base sha: $BASE_SHA"
          curl -s -H "$AUTH" -X POST "$API/repos/$REPO/git/refs" \
            -d "{\"ref\":\"refs/heads/ci-logs\",\"sha\":\"$BASE_SHA\"}" || true
          B64=$(base64 ci-error.log | tr -d '\n')
          RESP=$(curl -s -w '\nHTTP_%{http_code}' -H "$AUTH" -X PUT "$API/repos/$REPO/contents/ci-error.log" \
            -d "$(jq -n --arg c "$B64" '{message:"ci: build error log",content:$c,branch:"ci-logs"}')")
          echo "$RESP"

      - name: Package .app bundle
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p build/ios/artifacts
          cd "$(dirname "$APP_PATH")"
          zip -qr "${{ github.workspace }}/build/ios/artifacts/storypad-community-unsigned.zip" "$(basename "$APP_PATH")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: storypad-ios-unsigned
          path: build/ios/artifacts/*.zip
          retention-days: 14
